[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrafast-engine"
version = "2.2.0"
description = "Nonlinear ultrafast pulse propagation through complete optical systems (Python bindings for UltrafastEngine)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Joseph Codemard", email = "jac318@bath.ac.uk" }]
keywords = ["ultrafast", "nonlinear optics", "pulse propagation", "NLSE", "Zemax", "OpticStudio", "laser"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# Development mode: load the engine through the .NET host instead of the NativeAOT library.
hosted = ["clr_loader>=0.2"]
plot = ["matplotlib>=3.5"]
animate = ["matplotlib>=3.5", "pillow>=9"]            # plotting.animate writes GIFs with Pillow
examples = ["ultrafast-examples"]                    # a separate wheel built locally: python build/package.py --examples-wheel; install with --find-links
test = ["pytest>=7"]

[project.scripts]
ultrafast-plot = "ultrafast.plot:main"

[project.urls]
Homepage = "https://github.com/JosephCodemard/UltrafastEngine"
Documentation = "https://josephcodemard.github.io/UltrafastEngine/"
Source = "https://github.com/JosephCodemard/UltrafastEngine"
Issues = "https://github.com/JosephCodemard/UltrafastEngine/issues"
Citation = "https://github.com/JosephCodemard/UltrafastEngine/blob/main/CITATION.cff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultrafast = ["bin/*", "bin/*/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
