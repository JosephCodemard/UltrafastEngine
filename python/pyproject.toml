[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrafast-engine"
version = "1.0.0"
description = "Nonlinear ultrafast pulse propagation through complete optical systems (Python bindings for UltrafastEngine)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Joseph Codemard", email = "jac318@bath.ac.uk" }]
keywords = ["ultrafast", "nonlinear optics", "pulse propagation", "NLSE", "Zemax", "OpticStudio", "laser"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
# what `pip install ultrafast-engine` brings: numpy; clr_loader, which starts the managed (.NET) engine; matplotlib for figures and the `ultrafast-plot` command
dependencies = ["numpy>=1.21", "clr_loader>=0.2", "matplotlib>=3.5"]

[project.optional-dependencies]
# These two are in the default install since 1.0.0a2; the names stay so that `pip install "ultrafast-engine[hosted,plot]"` keeps working.
hosted = ["clr_loader>=0.2"]
plot = ["matplotlib>=3.5"]
paper = ["matplotlib>=3.5", "SciencePlots>=2.1"]      # plotting style "science" (the look of SciencePlots; without it "paper" is used)
animate = ["matplotlib>=3.5", "pillow>=9"]            # plotting.animate writes GIFs with Pillow
all = ["matplotlib>=3.5", "SciencePlots>=2.1", "pillow>=9"]
test = ["pytest>=7"]

[project.scripts]
ultrafast-plot = "ultrafast.plot:main"
ultrafast-mcp = "ultrafast.mcp.server:main"
ultrafast-agent = "ultrafast.agents:main"

[project.urls]
Homepage = "https://github.com/JosephCodemard/UltrafastEngine"
Documentation = "https://josephcodemard.github.io/UltrafastEngine/"
Source = "https://github.com/JosephCodemard/UltrafastEngine"
Issues = "https://github.com/JosephCodemard/UltrafastEngine/issues"
Citation = "https://github.com/JosephCodemard/UltrafastEngine/blob/main/CITATION.cff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultrafast = ["bin/*", "bin/*/*", "py.typed", "agents/pack/*/SKILL.md", "agents/pack/AGENTS.md", "agents/pack/llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Type check (CI `python` job, tests/test_typecheck.py): `python -m mypy` from this folder.
# Scope: the typed front door only (builders, generated TypedDicts, calculators). Other modules are followed
# silently (their errors are not reported) and are not yet part of the gate.
[tool.mypy]
python_version = "3.10"
files = ["src/ultrafast/build.py", "src/ultrafast/types.py", "src/ultrafast/calc"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = false
show_error_codes = true

[[tool.mypy.overrides]]
# generated file: strict about its own shape (keep the generator correct, never edit it)
module = "ultrafast.types"
disallow_untyped_defs = true
disallow_incomplete_defs = true
