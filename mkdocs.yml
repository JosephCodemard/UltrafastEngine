site_name: UltrafastEngine
site_description: Nonlinear ultrafast pulse propagation through complete optical systems
site_url: https://josephcodemard.github.io/UltrafastEngine/
repo_url: https://github.com/JosephCodemard/UltrafastEngine
edit_uri: edit/main/docs/
docs_dir: docs
# CLAUDE.md files are instructions for Claude Code, not pages of the site
exclude_docs: |
  CLAUDE.md
theme:
  name: readthedocs
  custom_dir: overrides            # main.html adds the long logo as a footer
  logo: img/logo/ultrafast-logo-large-dark.svg   # sidebar (light text on the blue sidebar); generated by assets/logo/make_logo.py
extra_css:
  - css/brand.css                  # logo palette for the sidebar and links
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Capabilities & limitations: capabilities.md
  - Tutorials:
      - Overview: tutorials/index.md
      - 1. Your first simulation: tutorials/01-first-run.md
      - 2. Diagnostics: tutorials/02-diagnostics.md
      - 3. Larger systems: tutorials/03-larger-systems.md
      - 4. Your own measured data: tutorials/04-measured-data.md
      - 5. Contrast of an amplifier chain: tutorials/05-contrast.md
      - 6. Diffraction by an iris: tutorials/06-diffraction.md
  - Examples: examples/README.md
  - Gallery: gallery.md
  - Assets (synthetic data with answer keys): assets/README.md
  - Concepts: concepts.md
  - Architecture:
      - Overview: architecture/index.md
      - Code map: architecture/code-map.md
      - Key processes: architecture/processes.md
  - Model levels: model-levels.md
  - Reference:
      - System file: reference/system-file.md
      - Run spec: reference/run-spec.md
      - Models & overrides: reference/models.md
      - Materials: reference/materials.md
      - Gases (rotational Raman): reference/gases.md
      - Surfaces, losses, polarisation: reference/coatings.md
      - Optical components: reference/components.md
      - Delayed light (tails, ghosts, echoes): reference/delayed-light.md
      - Nonlinear physics & solvers: reference/nonlinear.md
      - Fibres & waveguides: reference/fibers.md
      - Ionisation & plasma: reference/ionization.md
      - Active elements & aux beams: reference/active-elements.md
      - Crystals (χ(2)): reference/crystals.md
      - Gain media & amplifiers: reference/gain.md
      - Oscillators & saturable absorbers: reference/oscillators.md
      - Branched systems: reference/branches.md
      - Position-dependent properties: reference/spatial-properties.md
      - Spatial models: reference/transverse.md
      - Modulator (pixelated devices): reference/modulator.md
      - Instruments: reference/instruments.md
      - Measured data: reference/measured-data.md
      - Pulse retrieval: reference/retrieval.md
      - Parameter studies: reference/studies.md
      - Speed & compute back-ends: reference/speed.md
      - Results: reference/results.md
      - Option reference (generated): reference/options.md
      - Schemas, validation & migrations: reference/schema.md
      - Plugin system: reference/plugins.md
  - Interfaces:
      - Python: reference/python.md
      - Python API (generated): reference/python-api.md
      - C API (C/C++): reference/c-api.md
      - Extending: reference/extending.md
  - Plugins:
      - Overview: plugins/index.md
      - Installing plugins: plugins/installing.md
      - Fitting (transforms, fits, backward): plugins/fitting.md
      - Adaptive optics (DM, SLM, tiles, shaping): plugins/ao.md
      - Digital twin: plugins/twin.md
      - Zemax OpticStudio: plugins/zemax.md
      - GPU (CUDA, OpenCL): plugins/gpu.md
      - HITRAN (gas lines in air): plugins/hitran.md
  - Testing & validation:
      - Overview: testing.md
      - Component verification (scripts and plots): component-tests.md
      - Validation matrix (generated): reference/validation-matrix.md
      - Paper replications: papers/README.md
  - Roadmap: roadmap.md
  - For AI agents: agents.md
  - Claude Code: claude-code.md
  - Releasing (build.sh): releasing.md
  - Design notes:
      - Development history: design/history.md
      - Branched systems (design): design/branching.md
      - "Plan: next iteration": design/plan-next.md
      - "Backlog (parked design)": design/backlog.md
      - "Record: adaptive optics and digital twin": design/ao-twin-2026-11.md
      - "Spike measurements (S2)": design/notes/spikes.md
      - "WP0 housekeeping (2026-11-11)": design/notes/wp0.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
